[package]
name = "kata-agent"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "Durable, minimal, malleable Rust agent harness with pluggable storage, execution environments, crash recovery, CoW forks, and idempotent submissions."

[dependencies]
async-trait = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.40", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
uuid = { version = "1.10", features = ["serde", "v4", "v7"] }

[dev-dependencies]
tempfile = "3.12"
